{% extends "base.html" %}
{% block title %}Daftar{% endblock %}
{% block content %}
<div class="form-card">
  <h1 class="page-title">DAFTAR</h1>
  {% for e in errors %}<p class="error-text">{{ e }}</p>{% endfor %}
  <form method="post" action="/register">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <label for="name">Nama</label>
    <input id="name" name="name" type="text" required value="{{ values.name or '' }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required value="{{ values.email or '' }}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required minlength="8">
    <label for="password_confirm">Ulangi Password</label>
    <input id="password_confirm" name="password_confirm" type="password" required minlength="8">
    <div class="mt-lg">
      <button class="btn btn-primary w-full" type="submit">DAFTAR</button>
    </div>
  </form>
  <p class="page-sub mt-md">Sudah punya akun? <a href="/login">Masuk</a></p>
</div>
{% endblock %}
