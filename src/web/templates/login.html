{% extends "base.html" %}
{% block title %}Masuk{% endblock %}
{% block content %}
<div class="form-card">
  <h1 class="page-title">LOGIN</h1>
  {% if error %}<p class="error-text">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required value="{{ values.email or '' }}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required>
    <div style="margin-top:24px">
      <button class="btn btn-primary" type="submit" style="width:100%">LOGIN</button>
    </div>
  </form>
  <p class="page-sub" style="margin-top:16px">Belum punya akun? <a href="/register">Daftar</a></p>
</div>
{% endblock %}
