# Indo corpus serving config (phase 2, PRD v1.1 approved 2026-10-27).
#
# Served system = the evaluated system (Task 11): hybrid blend
#   scores = alpha * minmax(ALS dot) + (1 - alpha) * minmax(TF-IDF cosine)
# per user over the full dev catalog, alpha = winner of the sensitivity
# grid at mean NDCG@10 (models/indo_eval.json, 9 points, all cells n=600).
# The web layer never sends or overrides alpha (PRD AC-02).
model:
  type: "weighted_hybrid_indo"
  era: "indo"                      # MIND-era config stays configs/hybrid.yaml
  # alpha here is the ALS/CF weight: scores = a*minmax(cf) + (1-a)*minmax(cbf)
  cf_weight: 0.8                   # grid winner by mean NDCG@10
  content_weight: 0.2              # 1 - alpha

# Component artifacts (all generated by src/phase2/*; gitignored binaries,
# identities recorded by sha256 in data/DATASET_LOCK_INDO.md)
components:
  catalog_path: "data/processed/indo/catalog.parquet"
  catalog_train_path: "data/processed/indo/catalog_train.parquet"
  catalog_dev_path: "data/processed/indo/catalog_dev.parquet"
  interactions_train_path: "data/processed/indo/interactions_train.parquet"
  interactions_dev_path: "data/processed/indo/interactions_dev.parquet"
  als_model_path: "models/indo_als_model.pkl"
  als_user_factors_path: "models/indo_als_user_factors.npy"
  als_item_factors_path: "models/indo_als_item_factors.npy"

# Effective catalog (Gate B, data/DATASET_LOCK_INDO.md): items published
# >= 2025-09-01 (17,584 items of 67,381). CF items = train-viewed subset
# with factors (13,881); factorless items are CBF-only at serving.
effective_catalog:
  since: "2025-09-01"
  n_items: 17584

# Popularity feed source (RECOMMENDATION_INTEGRATION 4.1): train view
# counts desc, nid asc tie-break (weight column = view count).
popularity:
  interactions_train_path: "data/processed/indo/interactions_train.parquet"
